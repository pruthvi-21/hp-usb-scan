<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<title>Scanner</title>
<style>
  /* Boxy Material 3 look, matching Libreel's AppShapesBoxy: 2px controls, 4px surfaces. Dark only. */
  :root {
    color-scheme: dark;
    --r-sm: 2px; --r-md: 4px;
    --bg: #000000; --surface: #000000; --surface-var: #141414; --surface-high: #202020;
    --text: #ececec; --muted: #a3a3a3; --outline: rgba(255, 255, 255, .12);
    --primary: #4285f4; --on-primary: #ffffff; --tonal: #1c2b45; --on-tonal: #d2e3fc;
    --error: #ff5d5d; --ok: #5cd08a; --warn: #ffd54a; --scrim: #000000;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.4 Roboto, -apple-system, system-ui, "Segoe UI", sans-serif; }
  button { font-family: inherit; }

  .layout { max-width: 560px; margin: 0 auto; }
  .controls { padding: 16px 16px 0; }
  .gallery { padding: 0 16px 120px; }
  header { display: flex; align-items: center; justify-content: space-between; margin: 4px 0 16px; }
  h1 { font-size: 22px; font-weight: 500; margin: 0; }
  .status { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); }
  .dot { width: 8px; height: 8px; border-radius: 1px; background: var(--muted); }
  .dot.ok { background: var(--ok); } .dot.bad { background: var(--error); } .dot.busy { background: var(--warn); }

  .card { background: var(--surface); border: 1px solid var(--outline); border-radius: var(--r-md); padding: 16px; }
  .row { margin-bottom: 16px; }
  .row > label { display: block; font-size: 12px; font-weight: 500; letter-spacing: .5px; text-transform: uppercase;
    color: var(--muted); margin-bottom: 8px; }

  /* Toggle group: flat track, filled primary pill for the selection */
  .seg { display: flex; gap: 2px; background: var(--surface-var); border-radius: var(--r-sm); padding: 2px; }
  .seg button { flex: 1; border: 0; background: transparent; color: var(--muted); font-size: 15px; font-weight: 500;
    padding: 10px 4px; border-radius: var(--r-sm); cursor: pointer; transition: background .15s, color .15s; }
  .seg button small { display: block; font-size: 12px; font-weight: 400; opacity: .8; margin-top: 1px; }
  .seg button.on { background: var(--primary); color: var(--on-primary); }
  .seg.chips { display: grid; grid-template-columns: repeat(3, 1fr); }
  .custom { display: none; align-items: center; gap: 12px; margin-top: 10px; }
  .custom.show { display: flex; }
  .custom input { flex: 1; accent-color: var(--primary); }
  .custom output { min-width: 76px; text-align: right; font-weight: 500; font-variant-numeric: tabular-nums; }

  .scan-row { display: flex; gap: 8px; }
  .scan-btn { flex: 1; border: 0; border-radius: var(--r-md); background: var(--primary); color: var(--on-primary);
    font-size: 17px; font-weight: 500; letter-spacing: .1px; padding: 16px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 10px; }
  .scan-btn:disabled { opacity: .5; }
  .stop-btn { display: none; flex: 0 0 34%; border: 0; border-radius: var(--r-md); background: transparent;
    box-shadow: inset 0 0 0 1.5px var(--error); color: var(--error); font-size: 17px; font-weight: 500; cursor: pointer; }
  .stop-btn:disabled { opacity: .5; }
  .scanning .stop-btn { display: block; }
  .spinner { width: 16px; height: 16px; border: 2px solid currentColor; border-right-color: transparent;
    border-radius: 50%; animation: spin .8s linear infinite; display: none; }
  .scanning .scan-btn .spinner { display: inline-block; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .progress { display: none; margin-top: 12px; }
  .scanning .progress { display: block; }
  .progress-track { height: 4px; background: var(--surface-var); border-radius: var(--r-sm); overflow: hidden; }
  .progress-fill { height: 100%; width: 0; background: var(--primary); border-radius: var(--r-sm); transition: width .4s linear; }
  .progress-fill.indeterminate { width: 30%; animation: slide 1.2s ease-in-out infinite; }
  @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(340%); } }
  .progress-label { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted);
    margin-top: 6px; font-variant-numeric: tabular-nums; }
  .msg { font-size: 14px; margin-top: 12px; min-height: 1.4em; color: var(--muted); text-align: center; }
  .msg.err { color: var(--error); }

  .list-head { display: flex; align-items: center; justify-content: space-between; margin: 24px 0 10px; }
  h2 { font-size: 16px; font-weight: 500; margin: 0; }
  .text-btn { background: none; border: 0; color: var(--primary); font-size: 14px; font-weight: 500;
    padding: 8px 12px; margin-right: -12px; border-radius: var(--r-md); cursor: pointer; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
  .thumb { position: relative; aspect-ratio: .72; border-radius: var(--r-sm); overflow: hidden;
    background: var(--surface-var); cursor: pointer; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumb .check { position: absolute; top: 6px; right: 6px; min-width: 22px; height: 22px; padding: 0 4px; border-radius: var(--r-sm);
    border: 2px solid #fff; background: rgba(0,0,0,.3); display: none; color: var(--on-primary); font-size: 13px;
    align-items: center; justify-content: center; font-weight: 700; }
  .selecting .thumb .check { display: flex; }
  .thumb.sel .check { background: var(--primary); border-color: var(--primary); }
  .thumb.sel { outline: 3px solid var(--primary); outline-offset: -3px; }
  /* Tile for the scan in progress: live image, mask over the unscanned part, loading bar */
  .thumb.pending { cursor: pointer; }
  .selecting .thumb.pending { opacity: .5; cursor: default; }
  .thumb.pending img { object-fit: fill; background: #fff; }
  .thumb.pending .mask { position: absolute; left: 0; right: 0; top: 0; bottom: 0; background: var(--surface-var);
    transition: top .4s linear; }
  .thumb.pending .label { position: absolute; inset: 0 0 4px; display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 500; color: var(--muted); font-variant-numeric: tabular-nums; }
  .thumb.pending.has-image .label { align-items: flex-end; padding-bottom: 8px; color: var(--text); }
  .thumb.pending.has-image .label span { background: var(--surface); padding: 2px 6px; border-radius: var(--r-sm); }
  .thumb.pending .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: var(--surface-high);
    overflow: hidden; }
  .thumb.pending .bar div { height: 100%; width: 0; background: var(--primary); transition: width .4s linear; }
  .thumb.pending .bar div.indeterminate { width: 30%; animation: slide 1.2s ease-in-out infinite; }
  /* Actions shown when hovering a scan (mouse/trackpad only; touch taps open the viewer) */
  .thumb .hover-actions { position: absolute; left: 0; right: 0; bottom: 0; display: flex; gap: 2px; padding: 4px;
    background: rgba(0, 0, 0, .8); opacity: 0; transform: translateY(6px); pointer-events: none;
    transition: opacity .12s, transform .12s; }
  @media (hover: hover) {
    .thumb:not(.pending):hover .hover-actions, .thumb:focus-within .hover-actions {
      opacity: 1; transform: none; pointer-events: auto; }
  }
  .selecting .thumb .hover-actions { display: none; }
  .hover-actions button { flex: 1; min-width: 0; border: 0; background: transparent; color: #fff; cursor: pointer;
    border-radius: var(--r-sm); padding: 6px 0 4px; font-size: 10px; font-weight: 500; letter-spacing: .2px;
    display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .hover-actions button:hover, .hover-actions button:focus-visible { background: rgba(255, 255, 255, .14); outline: none; }
  .hover-actions button.danger { color: var(--error); }
  .hover-actions svg { width: 18px; height: 18px; fill: currentColor; }
  .empty { color: var(--muted); text-align: center; padding: 30px 0; font-size: 14px; grid-column: 1 / -1; }

  .btn { flex: 1; border: 0; background: var(--tonal); color: var(--on-tonal); font-size: 15px; font-weight: 500;
    padding: 14px; border-radius: var(--r-md); cursor: pointer; text-align: center; text-decoration: none; }
  .btn.primary { background: var(--primary); color: var(--on-primary); }
  .btn.danger { background: transparent; color: var(--error); box-shadow: inset 0 0 0 1px var(--outline); }
  .btn:disabled { opacity: .45; pointer-events: none; }
  [hidden] { display: none !important; }

  .bar { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    background: var(--surface-high); display: none; z-index: 5; }
  .bar .inner { max-width: 560px; margin: 0 auto; display: flex; gap: 8px; }
  .selecting .bar { display: block; }

  /* Narrow screens: tapping a scan opens it full screen */
  .viewer { position: fixed; inset: 0; background: var(--scrim); display: none; flex-direction: column; z-index: 10; }
  .viewer.open { display: flex; }
  .view-head { display: flex; flex-wrap: wrap; align-items: center; column-gap: 12px; padding: 12px 16px 0; }
  .view-head .name { flex: 1; min-width: 160px; background: transparent; border: 0; color: var(--text); font: inherit;
    font-size: 16px; font-weight: 500; padding: 8px 10px; margin-left: -10px; border-radius: var(--r-sm);
    text-overflow: ellipsis; }
  .view-head .name:hover:not(:disabled) { background: var(--surface-var); }
  .view-head .name:focus { background: var(--surface-var); outline: 2px solid var(--primary); outline-offset: -2px; }
  .view-head .name:disabled { opacity: 1; }
  .view-head .meta { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .view-head .meta b { color: var(--primary); font-weight: 500; }
  .viewer .img-wrap { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 20px;
    position: relative; }
  .viewer .crop-tools { padding: 0 16px; }
  .viewer .actions { display: flex; gap: 8px; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); }

  /* Wide screens: controls on the left, all scans in a large grid on the right */
  @media (min-width: 840px) {
    .layout { max-width: none; display: grid; grid-template-columns: minmax(360px, 420px) 1fr;
      grid-template-rows: minmax(0, 1fr); height: 100vh; height: 100dvh; }
    .controls { overflow-y: auto; padding-bottom: 32px; border-right: 1px solid var(--outline); }
    .gallery { overflow-y: auto; padding: 16px 24px 0; display: flex; flex-direction: column; }
    .gallery .list-head { margin-top: 4px; }
    .gallery .grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; padding-bottom: 32px; }
    .gallery .bar { position: sticky; bottom: 0; margin: auto -24px 0; }
    /* The viewer replaces the scans column, leaving the controls usable */
    .viewer { position: static; grid-column: 2; grid-row: 1; z-index: auto; min-width: 0; min-height: 0; }
    .layout:has(.viewer.open) .gallery { display: none; }
    .viewer .actions { max-width: 560px; width: 100%; align-self: center; padding-bottom: 20px; }
  }
  /* Cropper: the image, an SVG shade with a hole for the crop area, and draggable handles */
  .crop { position: relative; touch-action: none; user-select: none; -webkit-user-select: none; flex: none; }
  .crop img { width: 100%; height: 100%; display: block; background: #fff; border-radius: var(--r-sm);
    box-shadow: 0 1px 3px rgba(0,0,0,.2); pointer-events: none; }
  .crop-svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
  .crop-svg path { fill: rgba(0, 0, 0, .55); fill-rule: evenodd; }
  .crop-h { position: absolute; width: 40px; height: 40px; margin: -20px 0 0 -20px; cursor: move; }
  .crop-h::after { content: ""; position: absolute; left: 13px; top: 13px; width: 14px; height: 14px;
    background: var(--primary); border-radius: var(--r-sm); box-shadow: 0 1px 3px rgba(0,0,0,.4); }
  .crop-h.edge::after { background: var(--on-primary); box-shadow: 0 0 0 2px var(--primary), 0 1px 3px rgba(0,0,0,.4); }
  .crop-h.edge.tb { cursor: ns-resize; } .crop-h.edge.tb::after { left: 8px; top: 17px; width: 24px; height: 6px; }
  .crop-h.edge.lr { cursor: ew-resize; } .crop-h.edge.lr::after { left: 17px; top: 8px; width: 6px; height: 24px; }
  /* Loupe: zoomed view of the spot under the handle being dragged */
  .loupe { position: absolute; left: 0; top: 0; width: 112px; height: 112px; border-radius: var(--r-md);
    overflow: hidden; background: #000; pointer-events: none; z-index: 3; opacity: 0; transition: opacity .12s;
    box-shadow: 0 0 0 2px var(--primary), 0 6px 20px rgba(0, 0, 0, .55); }
  .loupe.show { opacity: 1; }
  .loupe canvas { display: block; width: 100%; height: 100%; }
  /* Export dialog */
  .modal { position: fixed; inset: 0; z-index: 30; display: flex; align-items: center; justify-content: center;
    padding: 16px; background: rgba(0, 0, 0, .7); }
  .modal[hidden] { display: none !important; }
  .modal .sheet { width: 100%; max-width: 420px; background: var(--surface-high); border-radius: var(--r-md);
    padding: 20px; box-shadow: 0 12px 40px rgba(0, 0, 0, .6); }
  .modal h3 { margin: 0 0 16px; font-size: 18px; font-weight: 500; }
  .modal label { display: block; font-size: 12px; font-weight: 500; letter-spacing: .5px; text-transform: uppercase;
    color: var(--muted); margin: 0 0 8px; }
  .modal .field { width: 100%; background: var(--surface-var); border: 0; border-radius: var(--r-sm); color: var(--text);
    font: inherit; padding: 10px 12px; margin-bottom: 18px; }
  .modal .field:focus { outline: 2px solid var(--primary); outline-offset: -2px; }
  .modal .name-row { display: flex; align-items: center; gap: 8px; }
  .modal .name-row .field { flex: 1; min-width: 0; }
  .modal .name-row .ext { color: var(--muted); margin-bottom: 18px; }
  .modal input[type=range] { width: 100%; accent-color: var(--primary); margin: 0; }
  .modal .scale { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-top: 4px; }
  .modal .result { display: flex; justify-content: space-between; align-items: baseline; gap: 12px;
    background: var(--surface-var); border-radius: var(--r-sm); padding: 12px; margin: 16px 0 20px;
    font-variant-numeric: tabular-nums; }
  .modal .result .q { color: var(--muted); font-size: 14px; }
  .modal .result .size { font-size: 20px; font-weight: 500; }
  .modal .result .size small { font-size: 13px; color: var(--muted); font-weight: 400; margin-left: 6px; }
  .modal .actions { display: flex; gap: 8px; }
  .crop-tools { display: flex; justify-content: center; gap: 4px; min-height: 36px; }
  .crop-tools .text-btn { margin: 0; }
  /* Eye button: hover (mouse) or press and hold (touch) to see the cropped result */
  .crop-tools .peek { display: inline-flex; align-items: center; gap: 6px; touch-action: none; user-select: none;
    -webkit-user-select: none; -webkit-touch-callout: none; }
  .crop-tools .peek svg { width: 18px; height: 18px; fill: currentColor; }
  .crop-tools .peek.on { background: var(--tonal); color: var(--on-tonal); }
  .crop-peek { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    padding: inherit; background: var(--scrim); opacity: 0; transition: opacity .16s ease-out; pointer-events: none; z-index: 1; }
  .crop-peek.show { opacity: 1; }
  .crop-peek .result { position: relative; overflow: hidden; background: #fff; border-radius: var(--r-sm);
    box-shadow: 0 1px 3px rgba(0,0,0,.2); flex: none; }
  .crop-peek canvas { display: block; width: 100%; height: 100%; }
  .crop-peek .tag { position: absolute; top: 8px; left: 50%; transform: translateX(-50%); font-size: 12px; font-weight: 500;
    background: var(--surface-high); color: var(--text); padding: 4px 8px; border-radius: var(--r-sm);
    font-variant-numeric: tabular-nums; white-space: nowrap; }
  .crop-tools .hint { font-size: 13px; color: var(--muted); align-self: center; }
  .paper { background: var(--surface); border: 1px dashed var(--outline); border-radius: var(--r-sm);
    max-width: 100%; max-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 12px; color: var(--muted); font-size: 14px; text-align: center; padding: 16px; overflow: hidden; position: relative; }
  .paper .spinner { display: inline-block; width: 22px; height: 22px; color: var(--primary); }
  .paper .live { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: fill; object-position: top; }
  .paper .live-mask { position: absolute; left: 0; right: 0; bottom: 0; background: var(--surface); }
  .paper .scanline { position: absolute; left: 0; right: 0; height: 2px; background: var(--primary);
    box-shadow: 0 0 12px var(--primary); transition: top .4s linear; }
  .paper.scanning.warm::after { content: ""; position: absolute; left: 0; right: 0; height: 2px; background: var(--primary);
    box-shadow: 0 0 12px var(--primary); animation: sweep 2.4s ease-in-out infinite alternate; }
  @keyframes sweep { from { top: 0; } to { top: calc(100% - 2px); } }
</style>
</head>
<body>
<div class="layout" id="app">
  <main class="controls">
    <header>
      <h1>Scanner</h1>
      <div class="status"><span class="dot" id="dot"></span><span id="statusText">Checking…</span></div>
    </header>

    <section class="card">
      <div class="row">
        <label>Color</label>
        <div class="seg" data-opt="color">
          <button data-v="true">Color</button>
          <button data-v="false">Black &amp; white</button>
        </div>
      </div>
      <div class="row">
        <label>Quality</label>
        <div class="seg" data-opt="quality">
          <button data-v="150">Quick<small>150 dpi</small></button>
          <button data-v="300">Good<small>300 dpi</small></button>
          <button data-v="600">Best<small>600 dpi</small></button>
          <button data-v="custom">Custom<small id="customSub">200 dpi</small></button>
        </div>
        <div class="custom" id="customRow">
          <input type="range" id="dpiSlider" min="75" max="1200" step="25" aria-label="Custom dpi">
          <output id="dpiOut">200 dpi</output>
        </div>
      </div>
      <div class="row">
        <label>Paper</label>
        <div class="seg chips" data-opt="size">
          <button data-v="a4">A4<small>210×297 mm</small></button>
          <button data-v="letter">Letter<small>8.5×11 in</small></button>
          <button data-v="b5">B5<small>176×250 mm</small></button>
          <button data-v="a5">A5<small>148×210 mm</small></button>
          <button data-v="a6">A6<small>105×148 mm</small></button>
          <button data-v="idcard">ID card<small>86×54 mm</small></button>
          <button data-v="photo4x6">Photo<small>4×6 in</small></button>
          <button data-v="photo5x7">Photo<small>5×7 in</small></button>
          <button data-v="full">Full glass<small>whole bed</small></button>
        </div>
      </div>
      <div class="scan-row">
        <button class="scan-btn" id="scanBtn"><span class="spinner"></span><span id="scanLabel">Scan</span></button>
        <button class="stop-btn" id="stopBtn">Stop</button>
      </div>
      <div class="progress">
        <div class="progress-track"><div class="progress-fill" id="progFill"></div></div>
        <div class="progress-label"><span id="progPhase">Starting…</span><span id="progPct"></span></div>
      </div>
      <div class="msg" id="msg">Put the page face down in the corner marked on the glass, then tap Scan.</div>
    </section>
  </main>

  <section class="gallery">
    <div class="list-head">
      <h2>Scans</h2>
      <button class="text-btn" id="selectBtn">Select</button>
    </div>
    <div class="grid" id="grid"></div>

    <div class="bar"><div class="inner">
      <button class="btn danger" id="delSel" disabled>Delete</button>
      <button class="btn primary" id="pdfSel" disabled>Save as PDF</button>
    </div></div>
  </section>

  <div class="viewer" id="viewer">
    <div class="view-head">
      <input class="name" id="viewName" spellcheck="false" autocomplete="off" aria-label="File name" title="Rename">
      <span class="meta" id="viewMeta"></span>
    </div>
    <div class="img-wrap" id="viewStage"></div>
    <div class="crop-tools" id="viewTools">
      <span class="hint">Drag the corners to crop</span>
      <button class="text-btn peek" data-act="peek" hidden title="Hover, or press and hold, to see the cropped result"
        aria-label="Preview crop"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17a5 5 0 1 1 0-10 5 5 0 0 1 0 10zm0-8a3 3 0 1 0 0 6 3 3 0 0 0 0-6z"/></svg>Preview</button>
      <button class="text-btn" data-act="reset" hidden>Reset crop</button>
      <button class="text-btn" data-act="restore" hidden>Restore original</button>
    </div>
    <div class="actions">
      <button class="btn" id="closeView">Close</button>
      <button class="btn danger" id="delView">Delete</button>
      <button class="btn primary" id="saveView">Save</button>
    </div>
  </div>
</div>


<div class="modal" id="exportModal" hidden role="dialog" aria-modal="true" aria-labelledby="exTitle">
  <div class="sheet">
    <h3 id="exTitle">Export</h3>
    <label for="exName">File name</label>
    <div class="name-row"><input class="field" id="exName" spellcheck="false" autocomplete="off"><span class="ext" id="exExt">.pdf</span></div>
    <label for="exQuality">Compression</label>
    <input type="range" id="exQuality" min="10" max="100" step="5" aria-label="Compression">
    <div class="scale"><span>Smaller file</span><span>Original</span></div>
    <div class="result"><span class="q" id="exQLabel"></span><span class="size" id="exSize">…</span></div>
    <div class="actions">
      <button class="btn" id="exCancel">Cancel</button>
      <button class="btn primary" id="exSave">Save…</button>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const app = $("app");
// Paper sizes in 1/300 inch, matching hpscan.SIZES; used to shape the scanning placeholder
const PAPER = { a4: [2480, 3508], letter: [2550, 3300], a5: [1748, 2480], a6: [1240, 1748], b5: [2079, 2953],

    if (!btns.some(b => b.dataset.v === String(opts[seg.dataset.opt]))) opts[seg.dataset.opt] = btns[0].dataset.v;
    btns.forEach(b => b.classList.toggle("on", b.dataset.v === String(opts[seg.dataset.opt])));

const fmtSize = b => b > 1e6 ? (b / 1e6).toFixed(1) + " MB" : Math.round(b / 1e3) + " KB";
const fmtName = n => { const m = n.match(/scan-(\d{4})(\d\d)(\d\d)-(\d\d)(\d\d)(\d\d)/);
  return m ? new Date(+m[1], m[2] - 1, +m[3], +m[4], +m[5], +m[6])
    .toLocaleString([], { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }) : n; };

async function refreshStatus() {
  if (busy) return;
  try {
    const s = await (await fetch("/api/status")).json();
    if (busy) return;
    $("dot").className = "dot " + (!s.connected ? "bad" : s.state === "Idle" ? "ok" : "busy");
    $("statusText").textContent = !s.connected ? "Printer not found" : s.state === "Idle" ? "Ready"
      : s.state === "Scanning" ? "Scanning" : "Busy";
    $("scanBtn").disabled = !s.connected || s.state === "Scanning";
    // Someone else (another phone, the Mac) is scanning: show it in the list too
    if (s.state === "Scanning" && !watcher) watcher = watchProgress(false);
  } catch {
    $("dot").className = "dot bad"; $("statusText").textContent = "Mac offline";
  }
}

async function deleteScan(name) {
  if (!confirm("Delete this scan?")) return;
  await fetch(`/api/scans/${name}`, { method: "DELETE" });
  loadScans();
}


async function loadScans() {
  scans = await (await fetch("/api/scans")).json();
  const grid = $("grid");
  grid.innerHTML = scans.length || pending ? "" : '<div class="empty">No scans yet</div>';
  if (pending) grid.appendChild(pending);
  for (const s of scans) {
    const el = document.createElement("div");
    el.className = "thumb" + (selected.has(s.name) ? " sel" : "");
    el.dataset.name = s.name;
    el.title = s.title;
    el.innerHTML = `<img loading="lazy" src="/scans/${s.name}?v=${s.version}" alt=""><span class="check"></span>` +
      `<div class="hover-actions">${HOVER_ACTIONS}</div>`;
    el.onclick = e => {
      const act = e.target.closest("[data-act]")?.dataset.act;
      if (selecting) return toggleSel(s.name);
      if (!act || act === "edit") return openViewer(s.name);
      if (act === "pdf") return openExport([s.name], "pdf");
      if (act === "jpeg") return openExport([s.name], "jpeg");
      if (act === "delete") return deleteScan(s.name);
    };
    grid.appendChild(el);
  }
  for (const n of selected) if (!scans.some(s => s.name === n)) selected.delete(n);  // deleted elsewhere
  renderSelection();
  updateBar();
  if ($("viewer").classList.contains("open")) {
    scans.some(s => s.name === viewing) ? openViewer(viewing) : $("viewer").classList.remove("open");
  }
}


// ---------- Cropper ----------
const FULL = [[0, 0], [1, 0], [1, 1], [0, 1]];  // corners: top-left, top-right, bottom-right, bottom-left
const MIN_ANGLE = 8 * Math.PI / 180;  // sharpest corner allowed; keep in sync with server.py
const clamp = (v, lo, hi) => Math.min(Math.max(v, lo), hi);

// Crop area over an image with four independently draggable corners. Edge handles move
// their two corners together; dragging inside moves the whole area. Corners are fractions.
function createCropper(host, src, initial, onChange) {
  const el = document.createElement("div");
  el.className = "crop";
  el.innerHTML = '<img alt="Scan"><svg class="crop-svg" viewBox="0 0 1000 1000" preserveAspectRatio="none"><path/></svg>' +
    [0, 1, 2, 3].map(i => `<span class="crop-h" data-c="${i}"></span>`).join("") +
    [0, 1, 2, 3].map(i => `<span class="crop-h edge ${i % 2 ? "lr" : "tb"}" data-e="${i}"></span>`).join("") +
    '<div class="loupe"><canvas></canvas></div>';
  const img = el.querySelector("img"), path = el.querySelector("path"), loupe = el.querySelector(".loupe");
  const cornerEls = [...el.querySelectorAll("[data-c]")], edgeEls = [...el.querySelectorAll("[data-e]")];
  const copy = pts => pts.map(p => [...p]);
  const start = copy(initial || FULL);
  let pts = copy(start), drag = null;

  // Fit the image inside the host, keeping its aspect ratio
  function fit() {
    if (!img.naturalWidth) return;
    const cs = getComputedStyle(host);
    const aw = host.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    const ah = host.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
    const k = Math.max(Math.min(aw / img.naturalWidth, ah / img.naturalHeight), 0);
    el.style.width = img.naturalWidth * k + "px";
    el.style.height = img.naturalHeight * k + "px";
  }
  function render() {
    const P = pts.map(([x, y]) => `${x * 1000} ${y * 1000}`);
    path.setAttribute("d", `M0 0H1000V1000H0Z M${P[0]} L${P[1]} L${P[2]} L${P[3]} Z`);
    const place = (node, x, y) => { node.style.left = x * 100 + "%"; node.style.top = y * 100 + "%"; };
    pts.forEach((p, i) => place(cornerEls[i], p[0], p[1]));
    edgeEls.forEach((node, i) => {
      const a = pts[i], b = pts[(i + 1) % 4];
      place(node, (a[0] + b[0]) / 2, (a[1] + b[1]) / 2);
    });
  }
  function inside(x, y) {  // point-in-polygon, in fractions
    let hit = false;
    for (let i = 0, j = 3; i < 4; j = i++) {
      const [xi, yi] = pts[i], [xj, yj] = pts[j];
      if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) hit = !hit;
    }
    return hit;
  }
  const local = e => { const r = el.getBoundingClientRect(); return [(e.clientX - r.left) / r.width, (e.clientY - r.top) / r.height]; };

  // Loupe: the full-resolution image around the dragged handle, zoomed well past the on-screen
  // size, with the crop edges and a crosshair, floating above the finger so it isn't covered
  const LOUPE = 112, GAP = 36;
  function drawLoupe() {
    if (!drag || drag.kind === "move" || !img.naturalWidth) return;
    const W = img.naturalWidth, H = img.naturalHeight, ew = el.clientWidth, eh = el.clientHeight;
    const i = drag.i, j = (i + 1) % 4;
    const [fx, fy] = drag.kind === "corner" ? pts[i] : [(pts[i][0] + pts[j][0]) / 2, (pts[i][1] + pts[j][1]) / 2];
    const hx = fx * ew, hy = fy * eh;  // handle position on screen

    // Above the handle; below it if there's no room; kept inside the image area sideways
    let lx = clamp(hx - LOUPE / 2, -12, ew - LOUPE + 12), ly = hy - LOUPE - GAP;
    if (ly < -12) ly = hy + GAP;
    loupe.style.transform = `translate(${lx}px, ${ly}px)`;

    const dpr = devicePixelRatio || 1, cv = loupe.querySelector("canvas");
    if (cv.width !== LOUPE * dpr) { cv.width = cv.height = LOUPE * dpr; }
    const ctx = cv.getContext("2d");
    // 4x the on-screen size, but never beyond 2 screen px per image px (just blur past that)
    const zoom = Math.min(4 * ew / W, 2) * dpr;         // loupe device px per image px
    const span = cv.width / zoom;                        // image px across the loupe
    const sx = fx * W - span / 2, sy = fy * H - span / 2;
    ctx.fillStyle = "#000"; ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.imageSmoothingQuality = "high";
    ctx.drawImage(img, sx, sy, span, span, 0, 0, cv.width, cv.height);

    // Crop outline near the point, then a crosshair on the exact spot
    const toLoupe = ([x, y]) => [(x * W - sx) * zoom, (y * H - sy) * zoom];
    const primary = getComputedStyle(el).getPropertyValue("--primary").trim() || "#4285f4";
    ctx.lineWidth = 2 * dpr; ctx.strokeStyle = primary;
    ctx.beginPath();
    pts.forEach((p, k) => { const [x, y] = toLoupe(p); k ? ctx.lineTo(x, y) : ctx.moveTo(x, y); });
    ctx.closePath(); ctx.stroke();
    const c = cv.width / 2, r = 7 * dpr;
    ctx.lineWidth = 1.5 * dpr; ctx.strokeStyle = "#fff";
    ctx.shadowColor = "rgba(0,0,0,.6)"; ctx.shadowBlur = 2 * dpr;
    ctx.beginPath();
    ctx.moveTo(c - r, c); ctx.lineTo(c + r, c); ctx.moveTo(c, c - r); ctx.lineTo(c, c + r);
    ctx.stroke(); ctx.shadowBlur = 0;
    loupe.classList.add("show");
  }
  const ro = new ResizeObserver(fit);
  ro.observe(host);

  el.addEventListener("pointerdown", e => {
    const t = e.target.dataset || {};
    const kind = t.c != null ? "corner" : t.e != null ? "edge" : inside(...local(e)) ? "move" : null;
    if (!kind) return;
    e.preventDefault();
    drag = { kind, i: +(t.c ?? t.e ?? 0), x: e.clientX, y: e.clientY, from: copy(pts), W: el.clientWidth, H: el.clientHeight };
    try { el.setPointerCapture(e.pointerId); } catch {}  // keep the drag if the finger leaves the image
    drawLoupe();
  });
  el.addEventListener("pointermove", e => {
    if (!drag) { el.style.cursor = inside(...local(e)) ? "move" : ""; return; }
    let dx = (e.clientX - drag.x) / drag.W, dy = (e.clientY - drag.y) / drag.H;
    const from = drag.from;
    let next;
    if (drag.kind === "corner") {
      next = copy(from);
      next[drag.i] = [clamp(from[drag.i][0] + dx, 0, 1), clamp(from[drag.i][1] + dy, 0, 1)];
    } else {
      // Edges move straight in or out (top/bottom vertically, sides horizontally); "move" shifts everything
      const idx = drag.kind === "edge" ? [drag.i, (drag.i + 1) % 4] : [0, 1, 2, 3];
      if (drag.kind === "edge") drag.i % 2 ? (dy = 0) : (dx = 0);
      const xs = idx.map(i => from[i][0]), ys = idx.map(i => from[i][1]);
      dx = clamp(dx, -Math.min(...xs), 1 - Math.max(...xs));
      dy = clamp(dy, -Math.min(...ys), 1 - Math.max(...ys));
      next = copy(from);
      idx.forEach(i => { next[i] = [from[i][0] + dx, from[i][1] + dy]; });
    }
    // Never let a corner cross the diagonal of its neighbours (folding the shape): if this move
    // would, stop at the furthest valid point between the last good shape and the requested one
    if (!convex(next)) {
      const lerp = t => pts.map((p, i) => [p[0] + (next[i][0] - p[0]) * t, p[1] + (next[i][1] - p[1]) * t]);
      let lo = 0, hi = 1;
      for (let n = 0; n < 14; n++) { const mid = (lo + hi) / 2; convex(lerp(mid)) ? (lo = mid) : (hi = mid); }
      next = lerp(lo);
    }
    pts = next;
    render(); onChange();
    drawLoupe();
  });
  // Convex, with every corner at least MIN_ANGLE and every edge a usable length. Measured in image
  // pixels (not fractions) so the aspect ratio doesn't distort angles; matches the server's check.
  function convex(p) {
    const W = img.naturalWidth || el.clientWidth || 1, H = img.naturalHeight || el.clientHeight || 1;
    const P = p.map(([x, y]) => [x * W, y * H]), minLen = 0.02 * Math.min(W, H);
    for (let i = 0; i < 4; i++) {
      const [a, b, c] = [P[i], P[(i + 1) % 4], P[(i + 2) % 4]];
      const e1 = [b[0] - a[0], b[1] - a[1]], e2 = [c[0] - b[0], c[1] - b[1]];
      const l1 = Math.hypot(...e1), l2 = Math.hypot(...e2);
      if (l1 < minLen || e1[0] * e2[1] - e1[1] * e2[0] < Math.sin(MIN_ANGLE) * l1 * l2) return false;
    }
    return true;
  }
  const end = () => { drag = null; loupe.classList.remove("show"); };
  el.addEventListener("pointerup", end);
  el.addEventListener("pointercancel", end);

  const differs = (a, b) => a.some((p, i) => Math.abs(p[0] - b[i][0]) > 0.002 || Math.abs(p[1] - b[i][1]) > 0.002);
  img.onload = () => { fit(); onChange(); };
  img.src = src;
  render();
  return {
    el, img,
    get corners() { return pts; },
    // Output size in pixels, computed the same way as the server (for the current corners by default)
    size(corners = pts) {
      const W = img.naturalWidth, H = img.naturalHeight;
      const P = corners.map(([x, y]) => [x * W, y * H]);
      const d = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1]);
      return [Math.round(Math.max(d(P[0], P[1]), d(P[3], P[2]))), Math.round(Math.max(d(P[0], P[3]), d(P[1], P[2])))];
    },
    startSize() { return this.size(start); },
    changed: () => differs(pts, start),
    isFull: () => !differs(pts, FULL),
    reset() { pts = copy(start); render(); onChange(); },
    destroy() { ro.disconnect(); },
  };
}

// Projective transform taking 4 source points onto 4 destination points, as the 8 coefficients
// [a b c d e f g h] of x' = (ax + by + c) / (gx + hy + 1), y' = (dx + ey + f) / (gx + hy + 1)
function homography(src, dst) {
  const m = [];
  src.forEach(([x, y], i) => {
    const [u, v] = dst[i];
    m.push([x, y, 1, 0, 0, 0, -u * x, -u * y, u]);
    m.push([0, 0, 0, x, y, 1, -v * x, -v * y, v]);
  });
  for (let col = 0; col < 8; col++) {  // Gaussian elimination with partial pivoting
    let p = col;
    for (let r = col + 1; r < 8; r++) if (Math.abs(m[r][col]) > Math.abs(m[p][col])) p = r;
    [m[col], m[p]] = [m[p], m[col]];
    for (let r = 0; r < 8; r++) {
      if (r === col || !m[col][col]) continue;
      const f = m[r][col] / m[col][col];
      for (let k = col; k < 9; k++) m[r][k] -= f * m[col][k];
    }
  }
  return m.map((row, i) => row[8] / row[i]);
}

// Pixels of a cropper's image, downscaled to at most `max` px on the long side (cached per image)
const sourceCache = new WeakMap();
function sourcePixels(img, max = 2400) {
  let src = sourceCache.get(img);
  if (!src || src.url !== img.src) {
    const s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const cv = document.createElement("canvas");
    cv.width = Math.round(img.naturalWidth * s); cv.height = Math.round(img.naturalHeight * s);
    const ctx = cv.getContext("2d", { willReadFrequently: true });
    ctx.drawImage(img, 0, 0, cv.width, cv.height);
    src = { url: img.src, scale: s, width: cv.width, height: cv.height,
      data: ctx.getImageData(0, 0, cv.width, cv.height).data };
    sourceCache.set(img, src);
  }
  return src;
}

// Overlay showing what the crop will produce, fitted into `host`. Each output pixel is traced
// back through the same corner mapping the server uses and sampled (bilinear) from the image.
// (A CSS matrix3d warp looked right in theory but Chrome rasterizes large perspective layers
// in approximate tiles, which skewed the text and dropped parts of the page.)
function cropPeek(host, c) {
  const [w, h] = c.size();
  const cs = getComputedStyle(host);
  const aw = host.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  const ah = host.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
  const k = Math.min(aw / w, ah / h);

  const el = document.createElement("div");
  el.className = "crop-peek";
  el.innerHTML = `<div class="result" style="width:${w * k}px;height:${h * k}px"><canvas></canvas></div>` +
    `<span class="tag">Result · ${w} × ${h}</span>`;

  const src = sourcePixels(c.img);
  const ow = Math.max(1, Math.round(w * k * devicePixelRatio)), oh = Math.max(1, Math.round(h * k * devicePixelRatio));
  const quad = c.corners.map(([x, y]) => [x * src.width, y * src.height]);
  const [a, b, cc, d, e, f, g, hh] = homography([[0, 0], [ow, 0], [ow, oh], [0, oh]], quad);
  const canvas = el.querySelector("canvas");
  canvas.width = ow; canvas.height = oh;
  const ctx = canvas.getContext("2d");
  const out = ctx.createImageData(ow, oh), o = out.data, p = src.data, SW = src.width, SH = src.height;
  for (let y = 0, i = 0; y < oh; y++) {
    const yc = y + 0.5;
    for (let x = 0; x < ow; x++, i += 4) {
      const xc = x + 0.5, q = g * xc + hh * yc + 1;
      let sx = (a * xc + b * yc + cc) / q - 0.5, sy = (d * xc + e * yc + f) / q - 0.5;
      sx = sx < 0 ? 0 : sx > SW - 1 ? SW - 1 : sx;
      sy = sy < 0 ? 0 : sy > SH - 1 ? SH - 1 : sy;
      const x0 = sx | 0, y0 = sy | 0, x1 = x0 + 1 < SW ? x0 + 1 : x0, y1 = y0 + 1 < SH ? y0 + 1 : y0;
      const fx = sx - x0, fy = sy - y0;
      const i00 = (y0 * SW + x0) * 4, i10 = (y0 * SW + x1) * 4, i01 = (y1 * SW + x0) * 4, i11 = (y1 * SW + x1) * 4;
      for (let ch = 0; ch < 3; ch++) {
        const top = p[i00 + ch] + (p[i10 + ch] - p[i00 + ch]) * fx;
        const bot = p[i01 + ch] + (p[i11 + ch] - p[i01 + ch]) * fx;
        o[i + ch] = top + (bot - top) * fy;
      }
      o[i + 3] = 255;
    }
  }
  ctx.putImageData(out, 0, 0);
  return el;
}

// A scan with a cropper, wired to its Save button and crop tools
function mountEditor(host, scan, ui) {
  // A cropped scan is edited on its original, with the current crop box in place
  const src = `/scans/${scan.name}?v=${scan.version}` + (scan.crop ? "&original" : "");
  const c = createCropper(host, src, scan.crop, sync);
  const btn = act => ui.tools.querySelector(`[data-act=${act}]`);
  function sync() {
    const changed = c.changed();
    ui.save.disabled = !changed;  // Save applies the crop; exports live on the tile actions
    btn("reset").hidden = !changed;
    btn("restore").hidden = !scan.crop || changed;
    btn("peek").hidden = c.isFull();
    ui.tools.querySelector(".hint").hidden = changed || !!scan.crop;
    if (ui.meta && c.img.naturalWidth) {
      const [cw, ch] = c.startSize(), [w, h] = c.size();
      ui.meta.innerHTML = changed ? `${cw} × ${ch} → <b>${w} × ${h}</b>` : `${cw} × ${ch}`;
    }
  }
  btn("reset").onclick = () => c.reset();

  // Eye button: hover with a mouse, or press and hold on touch, to peek at the result
  const peek = btn("peek");
  let peekEl = null;
  const showPeek = () => {
    if (peekEl || c.isFull() || !c.img.naturalWidth) return;
    peekEl = cropPeek(host, c);
    host.appendChild(peekEl);
    peek.classList.add("on");
    peekEl.getBoundingClientRect();  // commit the transparent state so the fade-in runs
    peekEl.classList.add("show");
  };
  const hidePeek = () => {
    if (!peekEl) return;
    const el = peekEl; peekEl = null;
    peek.classList.remove("on");
    el.classList.remove("show");
    setTimeout(() => el.remove(), 180);
  };
  peek.onpointerenter = e => { if (e.pointerType === "mouse") showPeek(); };
  peek.onpointerleave = hidePeek;
  peek.onpointerdown = e => {
    showPeek();
    try { peek.setPointerCapture(e.pointerId); } catch {}  // keep getting pointerup if the finger slides off
  };
  peek.onpointerup = e => { if (e.pointerType !== "mouse") hidePeek(); };
  peek.onpointercancel = hidePeek;
  peek.oncontextmenu = e => e.preventDefault();  // no long-press menu on phones
  peek.onclick = e => e.preventDefault();

  btn("restore").onclick = async () => {
    await fetch(`/api/scans/${scan.name}/restore`, { method: "POST" });
    await loadScans();
  };
  ui.save.onclick = async () => {
    if (!c.changed()) return;
    const save = ui.save;
    save.disabled = true; save.textContent = "Saving…";
    const r = c.isFull()
      ? await fetch(`/api/scans/${scan.name}/restore`, { method: "POST" })
      : await fetch(`/api/scans/${scan.name}/crop`, { method: "POST",
          headers: { "Content-Type": "application/json" }, body: JSON.stringify({ corners: c.corners }) });
    if (!r.ok) { alert((await r.json()).error || "Could not crop"); save.textContent = "Save"; sync(); return; }
    await loadScans();  // reopens the viewer on the saved scan
    save.textContent = "Saved";
    setTimeout(() => { if (save.textContent === "Saved") save.textContent = "Save"; }, 1500);
  };
  host.replaceChildren(c.el);
  sync();
  return c;
}


// Paper-shaped placeholder, sized to fit the stage with the chosen paper's aspect ratio
function paper(text, scanning) {
  const [w, h] = PAPER[opts.size] || PAPER.a4;
  const el = document.createElement("div");
  el.className = "paper" + (scanning ? " scanning warm" : "");
  el.style.aspectRatio = `${w} / ${h}`;
  el.style[w > h ? "width" : "height"] = w > h ? "min(100%, 520px)" : "100%";
  el.innerHTML = (scanning ? '<span class="spinner"></span>' : "") + `<span>${text}</span>`;
  return el;
}


// ---------- Scanning ----------
$("scanBtn").onclick = async () => {
  busy = true;
  $("scanBtn").disabled = true; app.classList.add("scanning");
  $("dot").className = "dot busy"; $("statusText").textContent = "Scanning";
  $("scanLabel").textContent = "Scanning…";
  const dpi = scanDpi();
  setMsg(dpi > 600 ? "Very high quality — this can take several minutes…"
       : dpi > 300 ? "High quality takes a minute or two…" : "This takes about 20–40 seconds…");
  watcher?.stop();
  watcher = watchProgress(true);
  try {
    const r = await fetch("/api/scan", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ dpi, color: opts.color === "true", size: opts.size }) });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || "Scan failed");
    if (j.cancelled) { setMsg("Scan stopped."); return; }
    // Show the result only if the user was watching the scan, not browsing older ones
    if (viewing === LIVE) viewing = j.name;
    setMsg("Done! Put the next page on the glass, or tap a scan to save it.");
  } catch (e) {
    setMsg(e.message, true);
  } finally {
    watcher.stop(); watcher = null;
    busy = false;
    $("stopBtn").disabled = false; $("stopBtn").textContent = "Stop";
    app.classList.remove("scanning"); $("scanLabel").textContent = "Scan"; $("scanBtn").disabled = false;
    await loadScans();
    refreshStatus();
  }
};

// Poll a scan's progress. Shows it as a tile at the front of the Scans list; for our own
// scan (`own`) also drives the Scan button, the progress bar and the live preview pane.
function watchProgress(own) {
  let stopped = false, liveBusy = false, lastLive = 0, liveUrl = null, seen = false;
  if (own) {
    $("progFill").className = "progress-fill indeterminate";
    $("progFill").style.width = "";
    $("progPhase").textContent = "Starting…"; $("progPct").textContent = "";
  }
  showPending(null, "Starting…");

  async function refreshLive(percent) {
    const r = await fetch("/api/live.jpg");
    if (!r.ok) return;
    const url = URL.createObjectURL(await r.blob());
    const img = new Image();
    img.src = url;
    try { await img.decode(); } catch { URL.revokeObjectURL(url); return; }
    if (stopped) { URL.revokeObjectURL(url); return; }
    if (pending) {
      const ti = pending.querySelector("img");
      ti.src = url; ti.hidden = false;
      pending.classList.add("has-image");
      pending.querySelector(".mask").style.top = percent + "%";
    }
    liveFrame = { url, percent };
    if (viewing === LIVE) showLive($("viewStage"), percent, url);
    const old = liveUrl; liveUrl = url;
    if (old) setTimeout(() => URL.revokeObjectURL(old), 2000);
  }

  async function tick() {
    if (stopped) return;
    try {
      const p = await (await fetch("/api/progress")).json();
      if (stopped) return;
      if (p.phase === "scanning" && p.percent > 0) {
        seen = true;
        const pct = Math.floor(p.percent);
        showPending(p.percent, pct + "%");
        if (own) {
          $("progFill").className = "progress-fill";
          $("progFill").style.width = p.percent + "%";
          $("progPhase").textContent = "Scanning"; $("progPct").textContent = pct + "%";
          $("scanLabel").textContent = `Scanning ${pct}%`;
        }
        if (!liveBusy && Date.now() - lastLive > 1200) {
          liveBusy = true; lastLive = Date.now();
          refreshLive(p.percent).catch(() => {}).finally(() => liveBusy = false);
        }
      } else if (p.phase === "warming up" || p.phase === "scanning" || p.phase === "starting") {
        seen = true;
        showPending(null, "Warming up…");
        if (own) $("progPhase").textContent = "Warming up…";
      } else if (!own && (p.phase === "idle" || p.phase === "done") && (seen || Date.now() - startedAt > 3000)) {
        // Another device's scan finished (or was stopped): drop the tile and show the result
        const viewingLive = viewing === LIVE;
        stop(); watcher = null;
        await loadScans();
        if (viewingLive && scans[0]) openViewer(scans[0].name);
        refreshStatus();

      }
    } catch {}
    setTimeout(tick, 600);
  }
  const startedAt = Date.now();
  function stop() {
    stopped = true;
    pending?.remove(); pending = null; liveFrame = null;
    // The live view has nothing left to show
    if (viewing === LIVE) { viewing = null; $("viewer").classList.remove("open"); }
    if (liveUrl) setTimeout(() => URL.revokeObjectURL(liveUrl), 2000);
  }
  tick();
  return { stop };
}

// The in-progress tile; percent null shows an indeterminate bar
function showPending(percent, text) {
  if (!pending) {
    pending = document.createElement("div");
    pending.className = "thumb pending";
    pending.onclick = () => { if (!selecting) openLiveViewer(); };
    pending.innerHTML = '<img alt="" hidden><div class="mask"></div><div class="label"><span></span></div><div class="bar"><div></div></div>';
    $("grid").querySelector(".empty")?.remove();
    $("grid").prepend(pending);
  }
  pending.querySelector(".label span").textContent = text;
  const bar = pending.querySelector(".bar div");
  bar.className = percent == null ? "indeterminate" : "";
  bar.style.width = percent == null ? "" : percent + "%";
}


// Live view of the scan in progress in the full-screen viewer
function openLiveViewer() {
  viewing = LIVE;
  viewEditor?.destroy(); viewEditor = null;
  $("viewName").value = "Scanning…"; $("viewName").disabled = true; $("viewMeta").textContent = "";
  $("viewTools").hidden = true;
  $("delView").disabled = $("saveView").disabled = true;
  $("viewStage").replaceChildren(paper("Warming up…", true));
  $("viewer").classList.add("open");
  if (liveFrame) showLive($("viewStage"), liveFrame.percent, liveFrame.url);
}

// Draw the latest partial image into the scanning placeholder inside `host`
async function showLive(host, percent, url) {
  const sheet = host.querySelector(".paper");
  if (!sheet) return;
  const img = new Image();
  img.className = "live"; img.alt = "";
  img.src = url;
  try { await img.decode(); } catch { return; }
  if (!sheet.isConnected) return;
  sheet.style.aspectRatio = `${img.naturalWidth} / ${img.naturalHeight}`;  // the real page shape
  sheet.classList.remove("warm");
  sheet.querySelectorAll("span").forEach(el => el.remove());
  let mask = sheet.querySelector(".live-mask"), line = sheet.querySelector(".scanline");
  if (!mask) {
    mask = Object.assign(document.createElement("div"), { className: "live-mask" });
    line = Object.assign(document.createElement("div"), { className: "scanline" });
  }
  // Cover the not-yet-scanned part (the decoder paints it gray) and put the scan line at the edge
  mask.style.top = percent + "%"; line.style.top = `calc(${percent}% - 1px)`;
  sheet.replaceChildren(img, mask, line);
}

$("stopBtn").onclick = async () => {
  $("stopBtn").disabled = true; $("stopBtn").textContent = "Stopping…";
  setMsg("Stopping — the scanner head will return in a few seconds…");
  try { await fetch("/api/cancel", { method: "POST" }); } catch {}
};

// ---------- Selection mode for multi-page PDF / bulk delete ----------
$("selectBtn").onclick = () => {
  selecting = !selecting; selected.clear();
  app.classList.toggle("selecting", selecting);
  $("selectBtn").textContent = selecting ? "Cancel" : "Select";
  renderSelection();
  updateBar();
};
// `selected` keeps the order scans were picked in (Sets iterate in insertion order);
// that is the page order of the PDF, shown as a number on each picked scan
function toggleSel(name) {
  selected.has(name) ? selected.delete(name) : selected.add(name);
  renderSelection();
  updateBar();
}
function renderSelection() {
  const order = [...selected];
  document.querySelectorAll(".thumb[data-name]").forEach(t => {
    const i = order.indexOf(t.dataset.name);
    t.classList.toggle("sel", i >= 0);
    t.querySelector(".check").textContent = i >= 0 ? i + 1 : "";
  });
}
function updateBar() {
  const n = selected.size;
  $("pdfSel").disabled = $("delSel").disabled = !n;
  $("pdfSel").textContent = n ? `Save ${n} as PDF` : "Save as PDF";
}
$("pdfSel").onclick = async () => {
  openExport([...selected], "pdf");  // pages in the order they were picked
};
$("delSel").onclick = async () => {
  if (!confirm(`Delete ${selected.size} scan(s)?`)) return;
  for (const n of selected) await fetch(`/api/scans/${n}`, { method: "DELETE" });
  selected.clear(); $("selectBtn").click(); loadScans();
};

// ---------- Full-screen viewer ----------
function openViewer(name) {
  const scan = scans.find(s => s.name === name);
  if (!scan) return;
  viewing = name;
  $("viewName").disabled = false;
  $("viewName").value = scan.title;
  $("viewTools").hidden = false;
  $("delView").disabled = $("saveView").disabled = false;
  $("viewer").classList.add("open");
  viewEditor?.destroy();
  viewEditor = mountEditor($("viewStage"), scan, { meta: $("viewMeta"), save: $("saveView"), tools: $("viewTools") });
}
// ---------- Export dialog: file name, compression with the exact resulting size, then a save location ----------
const exp = { names: [], format: "pdf", original: null, timer: 0, ctl: null, seq: 0 };
const exQuality = () => { const v = +$("exQuality").value; return v >= 100 ? null : Math.min(v, 95); };

function openExport(names, format) {
  Object.assign(exp, { names, format, original: null });
  const first = scans.find(s => s.name === names[0]);
  $("exTitle").textContent = format === "jpeg" ? "Export as JPEG"
    : names.length > 1 ? `Export ${names.length} pages as PDF` : "Export as PDF";
  $("exName").value = names.length === 1 ? (first?.title || names[0].slice(0, -4))
    : "Scans " + new Date().toISOString().slice(0, 10);
  $("exExt").textContent = format === "jpeg" ? ".jpg" : ".pdf";
  let q = 100;
  try { q = +(localStorage.getItem("exportQuality") || 100); } catch {}
  $("exQuality").value = q;
  $("exSave").disabled = false; $("exSave").textContent = "Save…";
  $("exportModal").hidden = false;
  exportSize(true);
  requestAnimationFrame(() => $("exSave").focus());
}
function closeExport() { $("exportModal").hidden = true; exp.ctl?.abort(); clearTimeout(exp.timer); }

async function fetchExport(quality, sizeOnly, signal) {
  const r = await fetch("/api/export", { method: "POST", signal, headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ names: exp.names, format: exp.format, quality, sizeOnly }) });
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || "Export failed");
  return sizeOnly ? (await r.json()).bytes : r.blob();
}

// Exact size for the slider's setting: the Mac recompresses and reports the byte count
function exportSize(now) {
  const q = exQuality(), seq = ++exp.seq;
  $("exQLabel").textContent = q == null ? "Original (no compression)" : `Quality ${q}`;
  $("exSize").textContent = "…";
  clearTimeout(exp.timer); exp.ctl?.abort();
  exp.timer = setTimeout(async () => {
    exp.ctl = new AbortController();
    try {
      if (exp.original == null) exp.original = await fetchExport(null, true, exp.ctl.signal);
      const bytes = q == null ? exp.original : await fetchExport(q, true, exp.ctl.signal);
      if (seq !== exp.seq) return;
      const saved = q != null && exp.original ? Math.round((1 - bytes / exp.original) * 100) : 0;
      $("exSize").innerHTML = fmtSize(bytes) + (saved > 0 ? `<small>−${saved}%</small>` : "");
    } catch (e) { if (e.name !== "AbortError" && seq === exp.seq) $("exSize").textContent = "—"; }
  }, now ? 0 : 250);
}
$("exQuality").addEventListener("input", () => {
  try { localStorage.setItem("exportQuality", $("exQuality").value); } catch {}
  exportSize(false);
});
$("exCancel").onclick = closeExport;
$("exportModal").addEventListener("click", e => { if (e.target === $("exportModal")) closeExport(); });

$("exSave").onclick = async () => {
  const ext = exp.format === "jpeg" ? ".jpg" : ".pdf";
  const filename = (clean => (clean || "scan") + ext)($("exName").value.trim().replace(/[\\/:*?"<>|]+/g, " ").replace(/\.(jpe?g|pdf)$/i, ""));
  const type = exp.format === "jpeg" ? { description: "JPEG image", accept: { "image/jpeg": [".jpg", ".jpeg"] } }
    : { description: "PDF document", accept: { "application/pdf": [".pdf"] } };
  // Ask where to save first, while the click still counts as a user action; browsers without a
  // save dialog (Safari, Firefox, phones, or pages opened over plain http by IP) fall back to a download
  let handle = null;
  if (window.showSaveFilePicker) {
    try { handle = await showSaveFilePicker({ suggestedName: filename, types: [type] }); }
    catch (e) { if (e.name === "AbortError") return; }  // they cancelled the save dialog
  }
  $("exSave").disabled = true; $("exSave").textContent = "Saving…";
  try {
    const blob = await fetchExport(exQuality(), false);
    if (handle) {
      const w = await handle.createWritable();
      await w.write(blob); await w.close();
    } else {
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob); a.download = filename; a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 10000);
    }
    closeExport();
    if (selecting) $("selectBtn").click();
  } catch (e) {
    alert(e.message);
    $("exSave").disabled = false; $("exSave").textContent = "Save…";
  }
};

document.addEventListener("keydown", e => {
  if (e.key === "Escape" && !$("exportModal").hidden) { closeExport(); return; }
  if (e.key === "Enter" && !$("exportModal").hidden && document.activeElement === $("exName")) { $("exSave").click(); return; }
  if (e.key === "Escape" && $("viewer").classList.contains("open") && document.activeElement !== $("viewName")) $("closeView").click();
});

// Renaming: saved on Enter or when the field loses focus; Esc undoes the edit
async function saveName() {
  const scan = scans.find(s => s.name === viewing), input = $("viewName");
  if (!scan || input.disabled || input.value.trim() === scan.title) { if (scan) input.value = scan.title; return; }
  const r = await fetch(`/api/scans/${scan.name}/title`, { method: "POST",
    headers: { "Content-Type": "application/json" }, body: JSON.stringify({ title: input.value }) });
  if (!r.ok) { input.value = scan.title; return; }
  scan.title = (await r.json()).title;
  if (viewing === scan.name) input.value = scan.title;
  const tile = document.querySelector(`.thumb[data-name="${scan.name}"]`);
  if (tile) tile.title = scan.title;
}
$("viewName").addEventListener("keydown", e => {
  if (e.key === "Enter") e.target.blur();
  if (e.key === "Escape") { e.target.value = scans.find(s => s.name === viewing)?.title ?? ""; e.target.blur(); }
});
$("viewName").addEventListener("blur", saveName);
$("viewName").addEventListener("focus", e => e.target.select());
$("closeView").onclick = () => { $("viewer").classList.remove("open"); viewEditor?.destroy(); viewEditor = null; viewing = null; };
$("delView").onclick = async () => {
  if (!confirm("Delete this scan?")) return;
  await fetch(`/api/scans/${viewing}`, { method: "DELETE" });
  $("viewer").classList.remove("open"); loadScans();
};

refreshStatus(); loadScans();
setInterval(refreshStatus, 5000);
</script>
</body>
